<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" style="background:#ffffff;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid10" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f3f1" stroke-width="1"/>
    </pattern>
    <pattern id="hatchYellow" width="15" height="15" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#eab308" stroke-width="4"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#192e27"/>
    </marker>
    <marker id="arr-rev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#192e27"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="url(#grid10)"/>

  <!-- Header -->
  <g transform="translate(40, 45)">
    <text font-size="20" font-weight="700" fill="#192e27" letter-spacing="-0.02em">PRISTUPAČNO PARKING MESTO / ACCESSIBLE PARKING BAY</text>
    <text y="22" font-size="12" fill="#586962">Standardi dimenzija i prilaza: Pravilnik RS 22/2015 i 10/2026 (čl. 5) · ISO 21542:2021 (§6)</text>
  </g>

  <!-- Left: Osnova parking mesta 370x500 cm -->
  <g transform="translate(40, 95)">
    <rect width="530" height="565" rx="6" fill="#f8faf9" stroke="#d5ded9" stroke-width="1.5"/>
    <text x="25" y="32" font-size="14" font-weight="700" fill="#192e27">1. Osnova: vozilo (250 cm) + manevarska traka (120 cm)</text>
    <text x="25" y="50" font-size="11" fill="#586962">Ukupna širina: min. 370 cm · Dužina: 500 cm · Max. podužni nagib: 2 %</text>

    <!-- Drawing area -->
    <g transform="translate(50, 75)">
      <!-- Asphalt background -->
      <rect x="20" y="40" width="370" height="420" fill="#2d3748" rx="4"/>

      <!-- Vehicle space 250 cm width -->
      <rect x="20" y="40" width="250" height="420" fill="#2d3748" stroke="#ffffff" stroke-width="4"/>

      <!-- Maneuvering hatched lane 120 cm width -->
      <rect x="270" y="40" width="120" height="420" fill="url(#hatchYellow)" stroke="#ffffff" stroke-width="4"/>

      <!-- Vehicle outline (Car) -->
      <g transform="translate(85, 120)">
        <rect x="0" y="0" width="120" height="260" rx="18" fill="#ffffff" opacity="0.85" stroke="#192e27" stroke-width="2"/>
        <!-- Windshield -->
        <path d="M 15 60 L 105 60 L 95 100 L 25 100 Z" fill="#94a3b8" stroke="#192e27" stroke-width="1.5"/>
        <!-- Rear window -->
        <path d="M 25 210 L 95 210 L 105 240 L 15 240 Z" fill="#94a3b8" stroke="#192e27" stroke-width="1.5"/>
        <text x="60" y="160" font-size="11" font-weight="700" fill="#192e27" text-anchor="middle">VOZILO</text>
      </g>

      <!-- Wheelchair symbol on asphalt in car bay -->
      <g transform="translate(145, 75)" fill="#ffffff">
        <circle cx="0" cy="0" r="5"/>
        <path d="M -3 7 L 3 7 L 1 18 L 8 24 M -6 18 A 8 8 0 1 1 5 26" fill="none" stroke="#ffffff" stroke-width="2"/>
      </g>

      <!-- Wheelchair user in transfer lane (120 cm) -->
      <g transform="translate(330, 250)">
        <circle cx="0" cy="0" r="28" fill="#d9f88d" opacity="0.4" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="3 3"/>
        <circle cx="0" cy="-6" r="6" fill="#2e7d32"/>
        <path d="M -5 3 L 5 3 L 3 15 L 12 21 M -8 15 A 10 10 0 1 1 4 24" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
        <text x="0" y="42" font-size="9" font-weight="700" fill="#2e7d32" text-anchor="middle">Transfer</text>
      </g>

      <!-- Dimensions: Top width breakdown -->
      <!-- Vehicle 250 cm -->
      <line x1="20" y1="20" x2="270" y2="20" stroke="#192e27" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
      <text x="145" y="14" font-size="10" font-weight="700" fill="#192e27" text-anchor="middle">Vozilo: 250 cm</text>

      <!-- Aisle 120 cm -->
      <line x1="270" y1="20" x2="390" y2="20" stroke="#192e27" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
      <text x="330" y="14" font-size="10" font-weight="700" fill="#192e27" text-anchor="middle">Traka: 120 cm</text>

      <!-- Total 370 cm -->
      <line x1="20" y1="-2" x2="390" y2="-2" stroke="#2e7d32" stroke-width="2" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
      <text x="205" y="-8" font-size="11" font-weight="800" fill="#2e7d32" text-anchor="middle">Ukupno min. 370 cm (čl. 5)</text>

      <!-- Length 500 cm -->
      <line x1="5" y1="40" x2="5" y2="460" stroke="#192e27" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
      <text x="-8" y="250" font-size="10" font-weight="700" fill="#192e27" text-anchor="middle" transform="rotate(-90 -8 250)">Dužina min. 500 cm</text>
    </g>
  </g>

  <!-- Right Top: Spušteni ivičnjak i veza sa trotoarom -->
  <g transform="translate(590, 95)">
    <rect width="370" height="270" rx="6" fill="#f8faf9" stroke="#d5ded9" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#192e27">2. Spušteni ivičnjak na trotoar (čl. 6)</text>

    <g transform="translate(30, 50)">
      <!-- Road level -->
      <line x1="0" y1="170" x2="100" y2="170" stroke="#2d3748" stroke-width="3"/>
      <text x="40" y="190" font-size="9" fill="#586962">Kolovoz</text>

      <!-- Dropped ramp kerb: max 8.3 % (1:12) -->
      <path d="M 100 170 L 190 125 L 300 125" fill="none" stroke="#2e7d32" stroke-width="3"/>
      <!-- Pavement fill -->
      <path d="M 100 170 L 190 125 L 300 125 L 300 200 L 0 200 Z" fill="#eaf0ec" opacity="0.6"/>

      <!-- Tactile warning paving 40-50 cm behind kerb -->
      <rect x="200" y="121" width="60" height="4" fill="#eab308"/>
      <text x="230" y="112" font-size="9" font-weight="700" fill="#eab308" text-anchor="middle">Taktilno polje</text>
      <text x="230" y="100" font-size="8" fill="#586962" text-anchor="middle">40–50 cm širine</text>

      <!-- Kerb ramp slope label -->
      <text x="145" y="140" font-size="10" font-weight="700" fill="#2e7d32" transform="rotate(-25 145 140)">max. 8,3 %</text>
      <text x="155" y="160" font-size="8" fill="#586962">nagib rampe</text>

      <!-- Kerb flush transition -->
      <circle cx="100" cy="170" r="4" fill="#2e7d32"/>
      <text x="95" y="155" font-size="8.5" font-weight="600" fill="#2e7d32" text-anchor="end">Prag ≤ 1,5 cm</text>
    </g>
  </g>

  <!-- Right Bottom: Pravila projektovanja parkinga -->
  <g transform="translate(590, 385)">
    <rect width="370" height="275" rx="6" fill="#f8faf9" stroke="#d5ded9" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#192e27">3. Ključna pravila za pristupačan parking</text>

    <g transform="translate(20, 45)">
      <circle cx="10" cy="10" r="4" fill="#2e7d32"/>
      <text x="22" y="13" font-size="10" font-weight="600" fill="#192e27">Broj mesta u odnosu na kapacitet:</text>
      <text x="22" y="27" font-size="9.5" fill="#586962">Min. 5 % od ukupnog broja mesta, a najmanje 1 mesto uvek (čl. 5).</text>

      <circle cx="10" cy="50" r="4" fill="#2e7d32"/>
      <text x="22" y="53" font-size="10" font-weight="600" fill="#192e27">Manevarska traka 120 cm:</text>
      <text x="22" y="67" font-size="9.5" fill="#586962">Obavezna šrafirana zona za bezbedan ulazak/izlazak kolica sa strane.</text>

      <circle cx="10" cy="90" r="4" fill="#2e7d32"/>
      <text x="22" y="93" font-size="10" font-weight="600" fill="#192e27">Maksimalna udaljenost od ulaza:</text>
      <text x="22" y="107" font-size="9.5" fill="#586962">Najviše 50 m od pristupačnog ulaza u objekat, bez stepenika na trasi.</text>

      <circle cx="10" cy="130" r="4" fill="#2e7d32"/>
      <text x="22" y="133" font-size="10" font-weight="600" fill="#192e27">Vertikalna i horizontalna signalizacija:</text>
      <text x="22" y="147" font-size="9.5" fill="#586962">Oznaka na tlu min. 100 × 100 cm i vertikalni saobraćajni znak.</text>

      <circle cx="10" cy="170" r="4" fill="#d32f2f"/>
      <text x="22" y="173" font-size="10" font-weight="700" fill="#d32f2f">Greška koju uklanjamo:</text>
      <text x="22" y="187" font-size="9.5" fill="#d32f2f">Standardno mesto 230 cm sa nacrtanim znakom gde se vrata ne mogu otvoriti.</text>
    </g>
  </g>
</svg>
