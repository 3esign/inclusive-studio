<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" style="background:#ffffff;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid10" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f3f1" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#192e27"/>
    </marker>
    <marker id="arr-rev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#192e27"/>
    </marker>
  </defs>

  <!-- Background grid -->
  <rect width="1000" height="700" fill="url(#grid10)"/>

  <!-- Header -->
  <g transform="translate(40, 45)">
    <text font-size="20" font-weight="700" fill="#192e27" letter-spacing="-0.02em">MANEVARSKI PROSTOR I ANTROPOMETRIJA / MANOEUVRING SPACE</text>
    <text y="22" font-size="12" fill="#586962">Standardi dimenzionisanja: Pravilnik RS 22/2015 i 10/2026 (čl. 14, 18, 19) · ISO 21542:2021</text>
  </g>

  <!-- Section 1: Turning circle Ø150 cm (Čl. 19) -->
  <g transform="translate(40, 100)">
    <rect width="440" height="340" rx="6" fill="#f8faf9" stroke="#d5ded9" stroke-width="1.5"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#192e27">1. Obrtni krug za 360° / Turning Circle (čl. 19)</text>
    <text x="20" y="48" font-size="11" fill="#586962">Minimalan slobodan prostor za puni zaokret invalidskih kolica bez prepreka</text>

    <!-- Circle Ø150 cm representation -->
    <g transform="translate(220, 190)">
      <!-- Circle area -->
      <circle r="110" fill="#eaf6ee" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4"/>
      <!-- Center mark -->
      <path d="M -10 0 L 10 0 M 0 -10 L 0 10" stroke="#2e7d32" stroke-width="1.5"/>
      <!-- Wheelchair footprint inside (70x120 cm) -->
      <rect x="-35" y="-60" width="70" height="120" rx="6" fill="#ffffff" stroke="#192e27" stroke-width="2"/>
      <!-- Wheelchair details -->
      <rect x="-42" y="-15" width="7" height="65" rx="3" fill="#192e27"/>
      <rect x="35" y="-15" width="7" height="65" rx="3" fill="#192e27"/>
      <circle cx="-25" cy="-45" r="5" fill="#192e27"/>
      <circle cx="25" cy="-45" r="5" fill="#192e27"/>
      <path d="M -25 -25 Q 0 -35 25 -25" fill="none" stroke="#192e27" stroke-width="2"/>

      <!-- Rotation arrows -->
      <path d="M 85 -55 A 100 100 0 0 1 100 20" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr)"/>
      <path d="M -85 55 A 100 100 0 0 1 -100 -20" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr)"/>

      <!-- Diameter dimension line -->
      <line x1="-110" y1="130" x2="110" y2="130" stroke="#192e27" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
      <line x1="-110" y1="115" x2="-110" y2="140" stroke="#192e27" stroke-width="1"/>
      <line x1="110" y1="115" x2="110" y2="140" stroke="#192e27" stroke-width="1"/>
      <text x="0" y="146" font-size="12" font-weight="700" fill="#192e27" text-anchor="middle">Ø 150 cm (min. propisano)</text>
    </g>
  </g>

  <!-- Section 2: Gabariti i doseg / Wheelchair Footprint & Reach -->
  <g transform="translate(520, 100)">
    <rect width="440" height="340" rx="6" fill="#f8faf9" stroke="#d5ded9" stroke-width="1.5"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#192e27">2. Gabarit kolica i zone dohvata / Dimensions &amp; Reach</text>
    <text x="20" y="48" font-size="11" fill="#586962">Standardni gabarit korisnika: 70 × 120 cm · Optimalni doseg rukom: 40–120 cm</text>

    <!-- Plan view: 70 x 120 cm -->
    <g transform="translate(60, 90)">
      <rect x="0" y="0" width="80" height="140" rx="8" fill="#ffffff" stroke="#192e27" stroke-width="2"/>
      <!-- Wheels -->
      <rect x="-8" y="55" width="8" height="75" rx="3" fill="#192e27"/>
      <rect x="80" y="55" width="8" height="75" rx="3" fill="#192e27"/>
      <circle cx="20" cy="25" r="7" fill="#192e27"/>
      <circle cx="60" cy="25" r="7" fill="#192e27"/>
      <text x="40" y="80" font-size="11" font-weight="600" fill="#192e27" text-anchor="middle">OSNOVA</text>
      <!-- Width dim -->
      <line x1="0" y1="160" x2="80" y2="160" stroke="#192e27" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
      <text x="40" y="175" font-size="11" font-weight="700" fill="#192e27" text-anchor="middle">70 cm</text>
      <!-- Length dim -->
      <line x1="105" y1="0" x2="105" y2="140" stroke="#192e27" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
      <text x="115" y="75" font-size="11" font-weight="700" fill="#192e27" dominant-baseline="middle">120 cm</text>
    </g>

    <!-- Side view with vertical reach zones -->
    <g transform="translate(260, 80)">
      <!-- Wall / reference line -->
      <line x1="130" y1="0" x2="130" y2="170" stroke="#8c9e96" stroke-width="2"/>
      <line x1="0" y1="170" x2="140" y2="170" stroke="#192e27" stroke-width="2"/>
      <text x="145" y="170" font-size="10" fill="#586962">KOTA PODA ±0.00</text>

      <!-- Side silhouette sketch -->
      <path d="M 20 160 C 20 120 40 120 45 90 C 50 60 70 50 80 40 C 90 30 100 40 95 60 C 90 75 75 90 75 120 L 75 160 Z" fill="#eaf6ee" stroke="#192e27" stroke-width="1.5"/>
      <circle cx="35" cy="130" r="28" fill="none" stroke="#192e27" stroke-width="2"/>
      <circle cx="85" cy="150" r="10" fill="none" stroke="#192e27" stroke-width="2"/>

      <!-- Reach zones on wall -->
      <!-- Max reach 120 cm -->
      <line x1="125" y1="40" x2="135" y2="40" stroke="#d32f2f" stroke-width="2"/>
      <text x="140" y="44" font-size="10" font-weight="700" fill="#d32f2f">120 cm (maks. doseg)</text>
      <!-- Preferred range: switches, intercoms, handles: 90-100 cm -->
      <rect x="126" y="60" width="8" height="25" fill="#2e7d32" opacity="0.8"/>
      <text x="140" y="75" font-size="10" font-weight="700" fill="#2e7d32">90–100 cm (kvake / tasteri)</text>
      <!-- Min reach 40 cm -->
      <line x1="125" y1="130" x2="135" y2="130" stroke="#d32f2f" stroke-width="2"/>
      <text x="140" y="134" font-size="10" font-weight="700" fill="#d32f2f">40 cm (min. utičnice)</text>
    </g>
  </g>

  <!-- Section 3: Širine hodnika i mimoilaženje / Corridor Clear Widths (Čl. 14) -->
  <g transform="translate(40, 460)">
    <rect width="920" height="200" rx="6" fill="#f8faf9" stroke="#d5ded9" stroke-width="1.5"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#192e27">3. Širine hodnika i mimoilaženje / Corridor Passing Widths (čl. 14)</text>

    <!-- Subcase A: Jednosmerno 90-120 cm -->
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="250" height="85" fill="#ffffff" stroke="#c2cec7" stroke-width="1"/>
      <line x1="0" y1="0" x2="250" y2="0" stroke="#192e27" stroke-width="3"/>
      <line x1="0" y1="85" x2="250" y2="85" stroke="#192e27" stroke-width="3"/>
      <!-- Single wheelchair passing -->
      <rect x="80" y="17" width="90" height="50" rx="4" fill="#eaf6ee" stroke="#192e27" stroke-width="1.5"/>
      <line x1="10" y1="0" x2="10" y2="85" stroke="#192e27" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
      <text x="25" y="48" font-size="11" font-weight="700" fill="#192e27">120 cm</text>
      <text x="125" y="110" font-size="11" font-weight="600" fill="#192e27" text-anchor="middle">A. Jednosmerno kretanje</text>
      <text x="125" y="125" font-size="10" fill="#586962" text-anchor="middle">Min. 120 cm (lokalno min. 90 cm)</text>
    </g>

    <!-- Subcase B: Mimoilaženje kolica i pešaka 150 cm -->
    <g transform="translate(330, 50)">
      <rect x="0" y="0" width="260" height="105" fill="#ffffff" stroke="#c2cec7" stroke-width="1"/>
      <line x1="0" y1="0" x2="260" y2="0" stroke="#192e27" stroke-width="3"/>
      <line x1="0" y1="105" x2="260" y2="105" stroke="#192e27" stroke-width="3"/>
      <!-- Wheelchair -->
      <rect x="40" y="12" width="85" height="48" rx="4" fill="#eaf6ee" stroke="#192e27" stroke-width="1.5"/>
      <!-- Pedestrian -->
      <circle cx="170" cy="78" r="16" fill="#ffffff" stroke="#192e27" stroke-width="1.5"/>
      <line x1="10" y1="0" x2="10" y2="105" stroke="#192e27" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
      <text x="25" y="58" font-size="11" font-weight="700" fill="#192e27">150 cm</text>
      <text x="130" y="125" font-size="11" font-weight="600" fill="#192e27" text-anchor="middle">B. Kolica + pešak</text>
      <text x="130" y="140" font-size="10" fill="#586962" text-anchor="middle">Udoban prolaz u javnim zgradama</text>
    </g>

    <!-- Subcase C: Mimoilaženje dvoje kolica 180 cm -->
    <g transform="translate(640, 50)">
      <rect x="0" y="0" width="250" height="120" fill="#ffffff" stroke="#c2cec7" stroke-width="1"/>
      <line x1="0" y1="0" x2="250" y2="0" stroke="#192e27" stroke-width="3"/>
      <line x1="0" y1="120" x2="250" y2="120" stroke="#192e27" stroke-width="3"/>
      <!-- Wheelchair 1 -->
      <rect x="40" y="12" width="85" height="46" rx="4" fill="#eaf6ee" stroke="#192e27" stroke-width="1.5"/>
      <!-- Wheelchair 2 -->
      <rect x="130" y="62" width="85" height="46" rx="4" fill="#eaf6ee" stroke="#192e27" stroke-width="1.5"/>
      <line x1="10" y1="0" x2="10" y2="120" stroke="#192e27" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
      <text x="25" y="66" font-size="11" font-weight="700" fill="#2e7d32">180 cm</text>
      <text x="125" y="140" font-size="11" font-weight="700" fill="#2e7d32" text-anchor="middle">C. Dvoje kolica / Dvosmerno</text>
      <text x="125" y="155" font-size="10" fill="#586962" text-anchor="middle">Zlatni standard (čl. 14 / ISO 21542)</text>
    </g>
  </g>
</svg>
