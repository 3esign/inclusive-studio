<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" style="background:#ffffff;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid10" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f3f1" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#192e27"/>
    </marker>
    <marker id="arr-rev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#192e27"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="url(#grid10)"/>

  <!-- Header -->
  <g transform="translate(40, 45)">
    <text font-size="20" font-weight="700" fill="#192e27" letter-spacing="-0.02em">SENZORNO ZONIRANJE I ASPECTSS™ INDEKS / SENSORY SPATIAL ZONING</text>
    <text y="22" font-size="12" fill="#586962">Naučni okvir za autizam i neurodivergentnost: Dr. Magda Mostafa · ASPECTSS™ Architectural Index (UIA)</text>
  </g>

  <!-- Left: Architectural spatial progression -->
  <g transform="translate(40, 95)">
    <rect width="580" height="565" rx="6" fill="#f8faf9" stroke="#d5ded9" stroke-width="1.5"/>
    <text x="25" y="32" font-size="14" font-weight="700" fill="#192e27">1. Arhitektonska prostorna sekvenca i dekompresija</text>
    <text x="25" y="50" font-size="11" fill="#586962">Postepeni prelaz: Visoka stimulacija → Senzorna pretkomora → Niska stimulacija → Niša za beg</text>

    <!-- Floor layout diagram -->
    <g transform="translate(35, 75)">
      <!-- Zone 1: High Stimulus Zone -->
      <rect x="0" y="40" width="130" height="360" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <text x="65" y="70" font-size="12" font-weight="700" fill="#ea580c" text-anchor="middle">ZONA VISOKE</text>
      <text x="65" y="86" font-size="12" font-weight="700" fill="#ea580c" text-anchor="middle">STIMULACIJE</text>
      <text x="65" y="110" font-size="9" fill="#586962" text-anchor="middle">Glavni ulaz</text>
      <text x="65" y="125" font-size="9" fill="#586962" text-anchor="middle">Atrijum, razgovor</text>
      <text x="65" y="140" font-size="9" fill="#586962" text-anchor="middle">Kretanje, gužva</text>

      <!-- Stimulus level indicator -->
      <rect x="15" y="340" width="100" height="24" rx="3" fill="#ea580c"/>
      <text x="65" y="356" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">65–75 dB · Jako svetlo</text>

      <!-- Arrow 1 to Transition -->
      <line x1="130" y1="220" x2="165" y2="220" stroke="#192e27" stroke-width="2" marker-end="url(#arr)"/>

      <!-- Zone 2: Sensory Transition Buffer / Airlock -->
      <rect x="170" y="80" width="100" height="280" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <text x="220" y="110" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">PRELAZNA</text>
      <text x="220" y="124" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">ZONA (C)</text>
      <text x="220" y="145" font-size="9" fill="#586962" text-anchor="middle">Pretkomora</text>
      <text x="220" y="160" font-size="9" fill="#586962" text-anchor="middle">Akustički plafon</text>
      <text x="220" y="175" font-size="9" fill="#586962" text-anchor="middle">Meko difuzno svetlo</text>

      <!-- Transition level -->
      <rect x="178" y="300" width="84" height="22" rx="3" fill="#16a34a"/>
      <text x="220" y="315" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">45–50 dB</text>

      <!-- Arrow 2 to Low Stimulus -->
      <line x1="270" y1="220" x2="305" y2="220" stroke="#192e27" stroke-width="2" marker-end="url(#arr)"/>

      <!-- Zone 3: Low Stimulus Zone -->
      <rect x="310" y="40" width="130" height="360" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
      <text x="375" y="70" font-size="12" font-weight="700" fill="#0284c7" text-anchor="middle">ZONA NISKE</text>
      <text x="375" y="86" font-size="12" font-weight="700" fill="#0284c7" text-anchor="middle">STIMULACIJE</text>
      <text x="375" y="110" font-size="9" fill="#586962" text-anchor="middle">Fokus, učenje</text>
      <text x="375" y="125" font-size="9" fill="#586962" text-anchor="middle">Čitanje, odmor</text>
      <text x="375" y="140" font-size="9" fill="#586962" text-anchor="middle">Neutralne boje</text>

      <!-- Low level -->
      <rect x="325" y="340" width="100" height="24" rx="3" fill="#0284c7"/>
      <text x="375" y="356" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">30–38 dB · RT60 &lt; 0,5s</text>

      <!-- Escape Space Niches (P) built into walls -->
      <g transform="translate(440, 100)">
        <path d="M 0 0 L 45 0 C 65 0 65 50 45 50 L 0 50 Z" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
        <text x="35" y="28" font-size="9" font-weight="700" fill="#4338ca" text-anchor="middle">BEG (P)</text>
      </g>
      <g transform="translate(440, 260)">
        <path d="M 0 0 L 45 0 C 65 0 65 50 45 50 L 0 50 Z" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
        <text x="35" y="28" font-size="9" font-weight="700" fill="#4338ca" text-anchor="middle">BEG (P)</text>
      </g>
      <text x="470" y="80" font-size="10" font-weight="700" fill="#4338ca">Prostori za povlačenje</text>
      <text x="470" y="93" font-size="8.5" fill="#586962">(Escape spaces / niše)</text>

      <!-- Spatial Sequencing indicator at bottom -->
      <line x1="10" y1="435" x2="490" y2="435" stroke="#192e27" stroke-width="1.5" marker-end="url(#arr)"/>
      <text x="250" y="452" font-size="11" font-weight="700" fill="#192e27" text-anchor="middle">Prostorni redosled / Spatial Sequencing (S): Jednosmeran, predvidljiv tok</text>
    </g>
  </g>

  <!-- Right: 7 ASPECTSS criteria explained -->
  <g transform="translate(640, 95)">
    <rect width="320" height="565" rx="6" fill="#f8faf9" stroke="#d5ded9" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#192e27">2. Sedam kriterijuma ASPECTSS™</text>

    <g transform="translate(15, 45)">
      <!-- A -->
      <rect x="0" y="0" width="22" height="22" rx="3" fill="#192e27"/>
      <text x="11" y="16" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
      <text x="30" y="15" font-size="11" font-weight="700" fill="#192e27">Akustika (Acoustics)</text>
      <text x="30" y="28" font-size="9" fill="#586962">Prigušenje odjeka RT60 &lt; 0,5 s; eliminacija buke.</text>

      <!-- S -->
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="22" height="22" rx="3" fill="#192e27"/>
        <text x="11" y="16" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
        <text x="30" y="15" font-size="11" font-weight="700" fill="#192e27">Prostorni redosled (Sequencing)</text>
        <text x="30" y="28" font-size="9" fill="#586962">Predvidljivo kretanje bez iznenadnih prelaza.</text>
      </g>

      <!-- P -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="22" height="22" rx="3" fill="#4338ca"/>
        <text x="11" y="16" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">P</text>
        <text x="30" y="15" font-size="11" font-weight="700" fill="#4338ca">Prostori za povlačenje (Escape)</text>
        <text x="30" y="28" font-size="9" fill="#586962">Male mirne niše uz tranzit za dekompresiju.</text>
      </g>

      <!-- E -->
      <g transform="translate(0, 144)">
        <rect x="0" y="0" width="22" height="22" rx="3" fill="#192e27"/>
        <text x="11" y="16" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
        <text x="30" y="15" font-size="11" font-weight="700" fill="#192e27">Razgraničenje (Compartmental.)</text>
        <text x="30" y="28" font-size="9" fill="#586962">Jedna soba = jedna jasna namena (bez haosa).</text>
      </g>

      <!-- C -->
      <g transform="translate(0, 192)">
        <rect x="0" y="0" width="22" height="22" rx="3" fill="#16a34a"/>
        <text x="11" y="16" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>
        <text x="30" y="15" font-size="11" font-weight="700" fill="#16a34a">Prelazne zone (Transition)</text>
        <text x="30" y="28" font-size="9" fill="#586962">Senzorni tamponi koji usklađuju svetlo i zvuk.</text>
      </g>

      <!-- T -->
      <g transform="translate(0, 240)">
        <rect x="0" y="0" width="22" height="22" rx="3" fill="#ea580c"/>
        <text x="11" y="16" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">T</text>
        <text x="30" y="15" font-size="11" font-weight="700" fill="#ea580c">Senzorno zoniranje (Zoning)</text>
        <text x="30" y="28" font-size="9" fill="#586962">Odvajanje visoko i nisko stimulativnih celina.</text>
      </g>

      <!-- S -->
      <g transform="translate(0, 288)">
        <rect x="0" y="0" width="22" height="22" rx="3" fill="#192e27"/>
        <text x="11" y="16" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
        <text x="30" y="15" font-size="11" font-weight="700" fill="#192e27">Sigurnost (Safety)</text>
        <text x="30" y="28" font-size="9" fill="#586962">Zaobljene ivice, netoksičnost, odsustvo rizika.</text>
      </g>

      <!-- Summary box -->
      <g transform="translate(0, 345)">
        <rect width="290" height="135" rx="4" fill="#ffffff" stroke="#d5ded9" stroke-width="1"/>
        <text x="15" y="25" font-size="11" font-weight="700" fill="#192e27">Arhitektonska suština:</text>
        <text x="15" y="44" font-size="9" fill="#586962">„Senzorno preopterećenje u arhitekturi</text>
        <text x="15" y="58" font-size="9" fill="#586962">nije lična slabost korisnika, već posledica</text>
        <text x="15" y="72" font-size="9" fill="#586962">nepromišljene prostorne sekvence i haotične</text>
        <text x="15" y="86" font-size="9" fill="#586962">akustike bez mesta za predah.”</text>
        <text x="15" y="110" font-size="9" font-weight="700" fill="#2e7d32">— Dr. Magda Mostafa, UIA</text>
      </g>
    </g>
  </g>
</svg>
