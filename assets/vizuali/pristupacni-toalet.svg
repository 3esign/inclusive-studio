<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" style="background:#ffffff;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <pattern id="grid10" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f3f1" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#192e27"/>
    </marker>
    <marker id="arr-rev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#192e27"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="url(#grid10)"/>

  <!-- Header -->
  <g transform="translate(40, 45)">
    <text font-size="20" font-weight="700" fill="#192e27" letter-spacing="-0.02em">PRISTUPAČNI SANITARNI ČVOR / ACCESSIBLE TOILET LAYOUT</text>
    <text y="22" font-size="12" fill="#586962">Standardi opremanja i manevara: Pravilnik RS 22/2015 i 10/2026 (čl. 25) · ISO 21542:2021</text>
  </g>

  <!-- Left: Plan view of 150x150 / 220x220 cabin -->
  <g transform="translate(40, 95)">
    <rect width="580" height="565" rx="6" fill="#f8faf9" stroke="#d5ded9" stroke-width="1.5"/>
    <text x="25" y="32" font-size="14" font-weight="700" fill="#192e27">Osnova kabine i transfer / Plan View &amp; Lateral Transfer</text>
    <text x="25" y="50" font-size="11" fill="#586962">Min. propisano: 150 × 150 cm (crveno) · Preporučeno: 220 × 220 cm (zeleno)</text>

    <!-- Cabin graphic -->
    <g transform="translate(70, 80)">
      <!-- Outer walls 220x220 boundary -->
      <rect x="0" y="0" width="380" height="380" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
      <rect x="-8" y="-8" width="396" height="396" fill="none" stroke="#192e27" stroke-width="6"/>

      <!-- 150x150 statutory min boundary -->
      <rect x="0" y="0" width="260" height="260" fill="#fcf8f8" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="250" y="275" font-size="10" font-weight="700" fill="#d32f2f" text-anchor="end">150 × 150 cm (min. čl. 25)</text>

      <!-- Turning circle Ø150 cm in corner -->
      <circle cx="170" cy="210" r="115" fill="#eaf6ee" opacity="0.6" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="170" y="215" font-size="11" font-weight="700" fill="#2e7d32" text-anchor="middle">Obrtni krug Ø 150 cm</text>

      <!-- Toilet Bowl (WC šolja) top-left -->
      <g transform="translate(70, 0)">
        <!-- Back cistern -->
        <rect x="-25" y="0" width="50" height="22" rx="3" fill="#ffffff" stroke="#192e27" stroke-width="2"/>
        <!-- Bowl -->
        <path d="M -22 22 L -22 65 C -22 95 22 95 22 65 L 22 22 Z" fill="#ffffff" stroke="#192e27" stroke-width="2"/>
        <!-- Seat hole -->
        <ellipse cx="0" cy="55" rx="14" ry="22" fill="#f0f5f2" stroke="#192e27" stroke-width="1.5"/>
        <!-- Wall grab bar (fixed, left) -->
        <rect x="-55" y="10" width="10" height="75" rx="4" fill="#8c9e96" stroke="#192e27" stroke-width="1.5"/>
        <text x="-65" y="50" font-size="9" font-weight="600" fill="#192e27" text-anchor="end">Fiksni rukohvat</text>
        <!-- Folding grab bar (right, transfer side) -->
        <rect x="35" y="10" width="10" height="75" rx="4" fill="#2e7d32" stroke="#192e27" stroke-width="2"/>
        <text x="50" y="50" font-size="9" font-weight="700" fill="#2e7d32">Preklopni rukohvat (h=75–80 cm)</text>
      </g>

      <!-- Transfer space dimension (min. 90 cm on right of bowl) -->
      <line x1="70" y1="125" x2="230" y2="125" stroke="#2e7d32" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
      <text x="150" y="140" font-size="11" font-weight="700" fill="#2e7d32" text-anchor="middle">≥ 90 cm (prostor za transfer)</text>

      <!-- Washbasin (Umivaonik) bottom-left -->
      <g transform="translate(0, 240)">
        <path d="M 0 0 L 70 0 C 70 45 0 45 0 35 Z" fill="#ffffff" stroke="#192e27" stroke-width="2"/>
        <ellipse cx="35" cy="20" rx="20" ry="12" fill="#eaf6ee" stroke="#192e27" stroke-width="1"/>
        <!-- Tap lever -->
        <line x1="35" y1="5" x2="35" y2="20" stroke="#192e27" stroke-width="2.5"/>
        <text x="80" y="25" font-size="10" font-weight="600" fill="#192e27">Umivaonik bez stuba</text>
      </g>

      <!-- Door (Vrata) opening outwards -->
      <g transform="translate(380, 260)">
        <!-- Wall cut -->
        <rect x="-8" y="0" width="16" height="110" fill="#ffffff"/>
        <!-- Door swing arc -->
        <path d="M 0 0 A 110 110 0 0 1 110 110" fill="none" stroke="#192e27" stroke-width="1.5" stroke-dasharray="4 3"/>
        <!-- Door leaf -->
        <line x1="0" y1="0" x2="110" y2="0" stroke="#192e27" stroke-width="3.5"/>
        <!-- Handle -->
        <rect x="90" y="-8" width="15" height="4" fill="#192e27"/>
        <text x="120" y="25" font-size="11" font-weight="700" fill="#192e27">Vrata min. 90 cm</text>
        <text x="120" y="40" font-size="10" fill="#586962">Otvaranje ka spolja (obavezno!)</text>
      </g>

      <!-- SOS Pull cord (Uzica alarma) -->
      <circle cx="15" cy="90" r="6" fill="#d32f2f"/>
      <path d="M 15 90 L 15 120" stroke="#d32f2f" stroke-width="2" stroke-dasharray="2 2"/>
      <circle cx="15" cy="120" r="4" fill="none" stroke="#d32f2f" stroke-width="2"/>
      <text x="25" y="105" font-size="10" font-weight="700" fill="#d32f2f">SOS uzica (do 10 cm od poda)</text>

      <!-- Dimension: 220 cm overall -->
      <line x1="0" y1="410" x2="380" y2="410" stroke="#192e27" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
      <text x="190" y="426" font-size="12" font-weight="700" fill="#192e27" text-anchor="middle">220 cm (preporučeno za puni komfor)</text>
    </g>
  </g>

  <!-- Right: Vertical section & Check specifications -->
  <g transform="translate(640, 95)">
    <rect width="320" height="565" rx="6" fill="#f8faf9" stroke="#d5ded9" stroke-width="1.5"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#192e27">Vertikalne kote / Clearances</text>

    <!-- Side view diagram -->
    <g transform="translate(30, 60)">
      <!-- Wall and floor -->
      <line x1="20" y1="0" x2="20" y2="180" stroke="#192e27" stroke-width="4"/>
      <line x1="20" y1="180" x2="250" y2="180" stroke="#192e27" stroke-width="4"/>
      <text x="25" y="195" font-size="9" fill="#586962">KOTA GOTOVOG PODA ±0.00</text>

      <!-- Mirror -->
      <rect x="22" y="20" width="4" height="60" fill="#90caf9" stroke="#1976d2"/>
      <text x="35" y="55" font-size="10" font-weight="600" fill="#1976d2">Ogledalo (donja ivica ≤ 100 cm)</text>

      <!-- Washbasin -->
      <rect x="22" y="90" width="55" height="15" rx="3" fill="#ffffff" stroke="#192e27" stroke-width="1.5"/>
      <line x1="30" y1="105" x2="30" y2="180" stroke="#8c9e96" stroke-width="1"/>
      <text x="85" y="102" font-size="10" font-weight="700" fill="#192e27">Umivaonik h = 80–85 cm</text>
      <!-- Knee clearance -->
      <rect x="24" y="105" width="45" height="75" fill="#eaf6ee" opacity="0.7"/>
      <text x="47" y="145" font-size="9" font-weight="700" fill="#2e7d32" text-anchor="middle">Slobodno ≥ 70 cm</text>

      <!-- Toilet side view -->
      <g transform="translate(180, 115)">
        <rect x="0" y="0" width="50" height="65" rx="4" fill="#ffffff" stroke="#192e27" stroke-width="1.5"/>
        <line x1="0" y1="10" x2="50" y2="10" stroke="#192e27" stroke-width="2"/>
        <text x="25" y="-10" font-size="10" font-weight="700" fill="#192e27" text-anchor="middle">WC šolja h = 45–48 cm</text>
      </g>
    </g>

    <!-- Checklist / Rulebook citations -->
    <g transform="translate(20, 280)">
      <rect width="280" height="260" rx="4" fill="#ffffff" stroke="#d5ded9"/>
      <text x="15" y="24" font-size="12" font-weight="700" fill="#192e27">KONTROLNA LISTA (ČL. 25)</text>

      <text x="15" y="50" font-size="10" font-weight="700" fill="#2e7d32">✓ Dimenzije kabine:</text>
      <text x="25" y="65" font-size="10" fill="#333333">Min. 150 × 150 cm; idealno 220 × 220 cm</text>

      <text x="15" y="85" font-size="10" font-weight="700" fill="#2e7d32">✓ Vrata:</text>
      <text x="25" y="100" font-size="10" fill="#333333">Svetla širina ≥ 90 cm, otvaranje ka spolja</text>

      <text x="15" y="120" font-size="10" font-weight="700" fill="#2e7d32">✓ WC šolja:</text>
      <text x="25" y="135" font-size="10" fill="#333333">Visina 45–48 cm, slobodan transfer 90 cm</text>

      <text x="15" y="155" font-size="10" font-weight="700" fill="#2e7d32">✓ Rukohvati:</text>
      <text x="25" y="170" font-size="10" fill="#333333">Visina 75–80 cm; jedan fiksni, jedan preklopni</text>

      <text x="15" y="190" font-size="10" font-weight="700" fill="#2e7d32">✓ Umivaonik:</text>
      <text x="25" y="205" font-size="10" fill="#333333">Gornja ivica 80–85 cm, prostor za noge 70 cm</text>

      <text x="15" y="225" font-size="10" font-weight="700" fill="#d32f2f">✓ Alarm (SOS):</text>
      <text x="25" y="240" font-size="10" fill="#333333">Uzica sa prstenom do 10–20 cm od poda</text>
    </g>
  </g>
</svg>
